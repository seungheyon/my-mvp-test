server:
  port: 8081

spring:
  application:
    name: mvp-practice

  datasource:
    url: jdbc:mysql://localhost:3306/mvpPractice?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: admin
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379
